<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Karthick G</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50%' y='65%' font-size='55' font-weight='800' fill='white' font-family='sans-serif' text-anchor='middle'>KG</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-alt);
      text-align: center;
      padding: 2rem;
    }
    .error-card {
      background: white;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 4rem 2.5rem;
      max-width: 520px;
      box-shadow: var(--shadow-xl);
    }
    .error-code {
      font-family: var(--font-display);
      font-size: 5rem;
      font-weight: 800;
      color: var(--primary-blue);
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 style="font-size: 1.8rem; margin-bottom: 0.75rem;">Page Not Found</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
      The page you are looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="btn btn-primary btn-glow">
      ← Return to Homepage
    </a>
  </div>
</body>
</html>
